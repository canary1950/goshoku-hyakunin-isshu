<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183153">
<title>五色百人一首 読み上げ</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23183153'/%3E%3Ccircle cx='20' cy='22' r='8' fill='%232f75d6'/%3E%3Ccircle cx='43' cy='22' r='8' fill='%23e15252'/%3E%3Ccircle cx='20' cy='43' r='8' fill='%23e3b82f'/%3E%3Ccircle cx='43' cy='43' r='8' fill='%233b9b68'/%3E%3C/svg%3E">
<style>
:root{--ink:#16243a;--muted:#67758a;--surface:#fff;--line:#dbe2ea;--navy:#183153;--bg:#eef3f8;--accent:#2f75d6;--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,select{font:inherit;touch-action:manipulation}button{cursor:pointer}.app{max-width:680px;margin:auto;min-height:100dvh;padding:12px 14px calc(18px + var(--safe-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 14px}h1{font-size:1.25rem;margin:0}.badge{font-size:.88rem;font-weight:800;background:#dfe9f5;padding:6px 10px;border-radius:999px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 30px #1c365b12}.hidden{display:none!important}
.lead{margin:0 0 15px;color:var(--muted);line-height:1.55}.colors{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.color-btn{min-height:86px;border:3px solid transparent;border-radius:18px;font-size:1.25rem;font-weight:900;background:#f4f7fa;color:#172235}.color-btn[data-color=blue]{border-color:#2871c9;background:#e9f3ff}.color-btn[data-color=pink]{border-color:#dc5570;background:#fff0f4}.color-btn[data-color=yellow]{border-color:#d4aa18;background:#fff8d8}.color-btn[data-color=green]{border-color:#318b5b;background:#e9f8ef}.color-btn[data-color=orange]{border-color:#df7b25;background:#fff0e2}.color-btn:last-child{grid-column:1/-1}
.setting{margin-top:18px}.setting label{display:block;font-weight:800;margin-bottom:8px}.setting select{width:100%;min-height:52px;border:2px solid var(--line);border-radius:14px;background:#fff;padding:0 12px;font-size:1rem}.note{font-size:.9rem;color:var(--muted);line-height:1.5;margin:10px 0 0}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.progress{font-weight:900;font-size:1.1rem}.remaining{color:var(--muted)}.bar{height:10px;background:#e7edf3;border-radius:99px;overflow:hidden;margin:11px 0 17px}.bar>div{height:100%;width:0;background:var(--accent);transition:width .25s}
.poem{border-radius:18px;padding:18px;background:#f7f9fc;border:2px solid var(--line);text-align:center;min-height:190px;display:flex;flex-direction:column;justify-content:center}.status{font-weight:900;color:var(--accent);margin-bottom:12px}.kami{font-size:1.28rem;font-weight:800;line-height:1.75}.shimo{font-size:1.08rem;line-height:1.7;color:#47566c;margin-top:8px}.number{font-size:.9rem;color:var(--muted);margin-top:12px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}.btn{border:0;border-radius:16px;min-height:60px;padding:10px;font-weight:900;font-size:1.05rem}.primary{grid-column:1/-1;background:var(--navy);color:white;min-height:72px;font-size:1.25rem}.secondary{background:#e7edf4;color:#1c304d}.danger{background:#fff0f0;color:#a52d38}.btn:disabled{opacity:.45;cursor:default}
.list{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.list summary{font-weight:900;padding:8px 2px;cursor:pointer}.history{list-style:none;margin:8px 0 0;padding:0;max-height:34vh;overflow:auto}.history li{padding:10px 4px;border-bottom:1px solid #e7ebf0;line-height:1.55}.done{padding:28px 12px;text-align:center}.done h2{font-size:1.7rem;margin:0 0 10px}.audio-help{margin-top:12px;padding:12px;border-radius:12px;background:#fff5dd;color:#73520a;line-height:1.5;font-size:.93rem}
@media(min-width:560px){.colors{grid-template-columns:repeat(3,1fr)}.color-btn:last-child{grid-column:auto}.app{padding-top:22px}.panel{padding:24px}}
</style>
</head>
<body><main class="app">
<header><h1>五色百人一首 読み上げ</h1><span class="badge" id="headerBadge">色を選ぶ</span></header>
<section id="setup" class="panel">
  <p class="lead">使う札の色を選んでください。20首をランダムな順番で読み上げます。</p>
  <div class="colors">
    <button class="color-btn" data-color="blue">青</button><button class="color-btn" data-color="pink">赤・桃</button><button class="color-btn" data-color="yellow">黄</button><button class="color-btn" data-color="green">緑</button><button class="color-btn" data-color="orange">橙</button>
  </div>
  <div class="setting"><label for="delay">ボタンを押してから読むまで</label><select id="delay"><option value="0">すぐに読む</option><option value="3">3秒後</option><option value="5" selected>5秒後</option><option value="10">10秒後</option></select><p class="note">札を取る人が構える時間として使えます。</p></div>
</section>
<section id="reader" class="panel hidden">
  <div class="topline"><span id="progress" class="progress">1 / 20</span><span id="remaining" class="remaining">残り19首</span></div><div class="bar"><div id="barFill"></div></div>
  <div class="poem"><div id="status" class="status">準備できました</div><div id="kami" class="kami">「読み上げ開始」を押してください</div><div id="shimo" class="shimo"></div><div id="poemNo" class="number"></div></div>
  <div id="audioHelp" class="audio-help hidden"></div>
  <div class="controls"><button id="pause" class="btn secondary" disabled>一時停止</button><button id="replay" class="btn secondary" disabled>もう一度読む</button><button id="mainAction" class="btn primary">読み上げ開始</button><button id="end" class="btn danger">終了して色を選ぶ</button></div>
  <details class="list"><summary>読み終えた札 <span id="historyCount">0</span>首</summary><ol id="history" class="history"></ol></details>
</section>
<section id="finish" class="panel hidden"><div class="done"><h2>20首を読み終えました</h2><p id="finishColor"></p><button id="again" class="btn primary">同じ色でもう一度</button><button id="change" class="btn secondary" style="width:100%;margin-top:12px">色を選び直す</button></div></section>
</main>
<script>
const poems=[{"id":1,"k":"あきの","g":"3","kami":"秋の田の かりほの庵の 苫をあらみ","yomi":"あきのたの かりほのいほの とまをあらみ","shimo":"わが衣手は 露にぬれつつ"},{"id":2,"k":"はるす","g":"3","kami":"春すぎて 夏来にけらし 白妙の","yomi":"はるすぎて なつきにけらし しろたへの","shimo":"衣ほすてふ 天の香具山"},{"id":3,"k":"あし","g":"2","kami":"あしびきの 山鳥の尾の しだり尾の","yomi":"あしびきの やまどりのをの しだりをの","shimo":"ながながし夜を ひとりかも寝む"},{"id":4,"k":"たご","g":"2","kami":"田子の浦に うち出でて見れば 白妙の","yomi":"たごのうらに うちいでてみれば しろたへの","shimo":"富士の高嶺に 雪は降りつつ"},{"id":5,"k":"おく","g":"2","kami":"奥山に 紅葉踏み分け 鳴く鹿の","yomi":"おくやまに もみぢふみわけ なくしかの","shimo":"声聞く時ぞ 秋は悲しき"},{"id":6,"k":"かさ","g":"2","kami":"かささぎの 渡せる橋に おく霜の","yomi":"かささぎの わたせるはしに おくしもの","shimo":"白きを見れば 夜ぞふけにける"},{"id":7,"k":"あまの","g":"3","kami":"天の原 ふりさけ見れば 春日なる","yomi":"あまのはら ふりさけみれば かすがなる","shimo":"三笠の山に 出でし月かも"},{"id":8,"k":"わがい","g":"3","kami":"わが庵は 都のたつみ しかぞ住む","yomi":"わがいほは みやこのたつみ しかぞすむ","shimo":"世をうぢ山と 人はいふなり"},{"id":9,"k":"はなの","g":"3","kami":"花の色は うつりにけりな いたづらに","yomi":"はなのいろは うつりにけりな いたづらに","shimo":"わが身世にふる ながめせしまに"},{"id":10,"k":"これ","g":"2","kami":"これやこの 行くも帰るも 別れては","yomi":"これやこの ゆくもかへるも わかれては","shimo":"知るも知らぬも 逢坂の関"},{"id":11,"k":"わたのはらや","g":"6","kami":"わたの原 八十島かけて こぎ出でぬと","yomi":"わたのはら やそしまかけて こぎいでぬと","shimo":"人には告げよ あまのつり舟"},{"id":12,"k":"あまつ","g":"3","kami":"天つ風 雲の通ひ路 吹きとぢよ","yomi":"あまつかぜ くものかよひぢ ふきとぢよ","shimo":"をとめの姿 しばしとどめむ"},{"id":13,"k":"つく","g":"2","kami":"筑波嶺の 峰より落つる みなの川","yomi":"つくばねの みねよりおつる みなのがは","shimo":"恋ぞつもりて 淵となりぬる"},{"id":14,"k":"みち","g":"2","kami":"陸奥の しのぶもぢずり 誰ゆゑに","yomi":"みちのくの しのぶもぢずり たれゆゑに","shimo":"乱れそめにし われならなくに"},{"id":15,"k":"きみがためは","g":"6","kami":"君がため 春の野に出でて 若菜つむ","yomi":"きみがため はるののにいでて わかなつむ","shimo":"わが衣手に 雪は降りつつ"},{"id":16,"k":"たち","g":"2","kami":"立ち別れ いなばの山の 峰に生ふる","yomi":"たちわかれ いなばのやまの みねにおふる","shimo":"まつとし聞かば 今帰り来む"},{"id":17,"k":"ちは","g":"2","kami":"ちはやぶる 神代も聞かず 竜田川","yomi":"ちはやぶる かみよもきかず たつたがは","shimo":"からくれなゐに 水くくるとは"},{"id":18,"k":"す","g":"1","kami":"住の江の 岸による波 よるさへや","yomi":"すみのえの きしによるなみ よるさへや","shimo":"夢の通ひ路 人目よくらむ"},{"id":19,"k":"なにはが","g":"4","kami":"難波潟 短き芦の ふしの間も","yomi":"なに function current(){return queue[index]}
function renderReady(){const p=current();if(!p)return finish();state='ready';$('progress').textContent=(index+1)+' / 20';$('remaining').textContent='残り'+(20-index-1)+'首';$('barFill').style.width=(index/20*100)+'%';$('status').textContent='準備できました';$('kami').textContent='「読み上げ開始」を押してください';$('shimo').textContent='';$('poemNo').textContent='';$('mainAction').textContent='読み上げ開始';$('mainAction').disabled=false;$('pause').disabled=true;$('pause').textContent='一時停止';$('replay').disabled=true;$('audioHelp').classList.add('hidden');renderHistory()}
function playCurrent(isReplay=false){stopAudio();const p=current(),delay=isReplay?0:Number($('delay').value);state='waiting';$('status').textContent=delay?delay+'秒後に読み上げます':'音声を準備しています';$('kami').textContent='';$('shimo').textContent='';$('poemNo').textContent='';$('mainAction').disabled=true;$('pause').disabled=false;$('pause').textContent='一時停止';timer=setTimeout(()=>{timer=null;audio=new Audio('audio/J_'+p.id+'.mp3');audio.preload='auto';audio.addEventListener('playing',()=>{state='playing';$('status').textContent='読み上げ中';$('pause').disabled=false;},{once:true});audio.addEventListener('ended',()=>{state='ended';$('status').textContent='読み上げが終わりました';$('kami').textContent=p.kami;$('shimo').textContent=p.shimo;$('poemNo').textContent=p.id+'番';$('mainAction').textContent=index===19?'終了':'次の札';$('mainAction').disabled=false;$('pause').disabled=true;$('replay').disabled=false;if(!history.some(x=>x.id===p.id))history.push(p);renderHistory()},{once:true});audio.addEventListener('error',()=>{state='error';$('status').textContent='音声を読み込めません';$('audioHelp').textContent='audio/J_'+p.id+'.mp3 を確認してください。index.htmlとaudioフォルダを同じ場所に置きます。';$('audioHelp').classList.remove('hidden');$('mainAction').textContent='次の札';$('mainAction').disabled=false;$('pause').disabled=true;$('replay').disabled=false;},{once:true});audio.play().catch(()=>{state='tap';$('status').textContent='もう一度タップしてください';$('mainAction').textContent='音声を再生';$('mainAction').disabled=false;$('pause').disabled=true;});},delay*1000)}
function mainAction(){if(state==='ready'||state==='tap'){playCurrent()}else if(state==='ended'||state==='error'){if(index>=19)finish();else{index++;renderReady()}}}
function pause(){if(state==='waiting'&&timer){clearTimeout(timer);timer=null;state='paused-wait';$('status').textContent='一時停止中';$('pause').textContent='再開'}else if(state==='paused-wait'){playCurrent()}else if(audio&&state==='playing'){audio.pause();state='paused';$('status').textContent='一時停止中';$('pause').textContent='再開'}else if(audio&&state==='paused'){audio.play();state='playing';$('status').textContent='読み上げ中';$('pause').textContent='一時停止'}}
function replay(){playCurrent(true)}
function renderHistory(){$('historyCount').textContent=history.length;$('history').innerHTML=history.map((p,i)=>'<li><b>'+(i+1)+'. '+p.id+'番</b>　'+p.kami+'<br>'+p.shimo+'</li>').join('')}
function finish(){stopAudio();releaseAwake();$('barFill').style.width='100%';$('finishColor').textContent=colorNames[selectedColor]+'の札をすべて読み終えました。';show('finish')}
function reset(){stopAudio();releaseAwake();selectedColor='';$('headerBadge').textContent='色を選ぶ';show('setup')}
document.querySelectorAll('.color-btn').forEach(b=>b.addEventListener('click',()=>begin(b.dataset.color)));$('mainAction').onclick=mainAction;$('pause').onclick=pause;$('replay').onclick=replay;$('end').onclick=reset;$('again').onclick=()=>begin(selectedColor);$('change').onclick=reset;
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&selectedColor&&!wakeLock)keepAwake()});
console.assert(poems.length===100,'100首');console.assert(Object.values(groups).every(x=>x.length===20),'各色20首');console.assert(new Set(Object.values(groups).flat()).size===100,'重複なし');
